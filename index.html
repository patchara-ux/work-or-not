<style>
:root{--navy:#0b1f4d;--navy2:#12307a;--blue:#2e9bff;--sky:#bfe3ff;--yel:#ffd23f;--ok:#2ecc71;--bad:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Kanit','Sarabun',sans-serif;color:#fff;background:radial-gradient(circle at 20% 0,var(--navy2),var(--navy) 60%);font-size:18px}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:34px;line-height:1.1;margin:8px 0;font-weight:800}
h1 b{color:var(--yel)}h2{margin:6px 0}
.card{background:rgba(255,255,255,.08);border:2px solid rgba(191,227,255,.25);border-radius:20px;padding:16px;margin:12px 0}
.light{background:#fff;color:var(--navy)}
.btn{display:block;width:100%;font:inherit;font-weight:600;font-size:20px;border:0;border-radius:16px;padding:15px;margin:10px 0;cursor:pointer;background:var(--yel);color:var(--navy);box-shadow:0 5px 0 #c99a00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a00}
.btn.alt{background:var(--blue);color:#fff;box-shadow:0 5px 0 #1a6cb8}
.btn.ghost{background:transparent;color:var(--sky);border:2px solid var(--sky);box-shadow:none}
input{width:100%;font:inherit;font-size:20px;padding:13px;border-radius:14px;border:3px solid var(--sky);margin:6px 0;color:var(--navy)}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:16px}
.chip{background:var(--navy2);border:2px solid var(--blue);border-radius:99px;padding:4px 12px}
.bar{height:14px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--yel));transition:width .4s}
.tbar i{background:var(--yel)}.tbar.low i{background:var(--bad)}
.lvl{color:var(--yel);font-weight:800}
.q{font-size:20px;font-weight:600;margin:8px 0}
svg{width:100%;height:auto;background:linear-gradient(#d9efff,#fff);border-radius:14px;display:block}
.ch{display:block;width:100%;text-align:left;font:inherit;font-size:18px;padding:14px;margin:9px 0;border-radius:14px;border:3px solid var(--sky);background:#fff;color:var(--navy);cursor:pointer}
.ch:disabled{cursor:default}.ch.ok{background:#d6f8e2;border-color:var(--ok)}.ch.no{background:#ffe0e1;border-color:var(--bad)}
.fb{border-radius:14px;padding:12px;margin-top:10px;font-size:17px}
.fb.ok{background:#d6f8e2;color:#0a5a2b}.fb.no{background:#ffe0e1;color:#8a1b20}
.big{font-size:56px;font-weight:800;color:var(--yel);text-align:center;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.grid div{background:var(--navy2);border-radius:14px;padding:10px}.grid b{display:block;font-size:26px;color:var(--yel)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:7px 5px;text-align:left;border-bottom:1px solid #cfe3f7}
.me{background:#fff3bf}.note{font-size:15px;background:#fff3bf;color:#5c4400;border-radius:12px;padding:10px;margin:8px 0}
pre{background:#001030;color:#bfe3ff;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;overflow-x:auto}
.tw{overflow-x:auto}
@media(min-width:800px){#app{max-width:720px}}

 P={name,no};localStorage.setItem("won_player",JSON.stringify(P));
 const ord=[];for(let l=0;l<5;l++)ord.push(...shuf(Q.filter(q=>q[0]==l)));
 G={q:ord.map(q=>{const idx=shuf(q[3].map((_,i)=>i));return{l:q[0],t:q[1],s:q[2],c:idx.map(i=>q[3][i]),a:idx.indexOf(q[4]),e:q[5]}}),i:0,score:0,ok:0,bad:0,st:0,bs:0,spent:0};
 ask()}
function ask(){const q=G.q[G.i];G.lock=false;G.t0=Date.now();
 app.innerHTML=`<div class="top"><span class="chip">⭐ <span id="sc">${G.score}</span></span><span class="chip">🔥 ต่อเนื่อง ${G.st}</span><span class="chip">⏱ <span id="tt">0.0</span></span></div>
 <div class="bar"><i style="width:${G.i/G.q.length*100}%"></i></div>
 <div class="top"><span class="lvl">${LV[q.l]}</span><span>ข้อ ${G.i+1}/${G.q.length}</span></div>
 <div class="bar tbar" id="tb"><i id="tf" style="width:100%"></i></div>
 <div class="card light">${scene(q.s)}<div class="q">${esc(q.t)}</div>
 ${q.c.map((c,i)=>`<button class="ch" onclick="ans(${i})">${"กขคง"[i]}. ${esc(c)}</button>`).join("")}<div id="fb"></div></div>`;
 clearInterval(tick);tick=setInterval(()=>{const e=(Date.now()-G.t0)/1000,l=Math.max(0,N_TIME-e);
  $("#tf").style.width=l/N_TIME*100+"%";$("#tb").classList.toggle("low",l<10);$("#tt").textContent=fmt((G.spent+Date.now()-G.t0)/1000);if(l<=0)ans(-1)},100)}
function ans(k){if(G.lock)return;G.lock=true;clearInterval(tick);const q=G.q[G.i],dt=Date.now()-G.t0;G.spent+=Math.min(dt,N_TIME*1000);
 const right=k==q.a;let msg;
 if(right){G.ok++;G.st++;G.bs=Math.max(G.bs,G.st);const tb=Math.round(50*Math.max(0,1-dt/(N_TIME*1000))),sb=G.st>=2?Math.min(20*(G.st-1),100):0;G.score+=100+tb+sb;
  msg=`✅ ถูกต้อง! +100 คะแนน, โบนัสเวลา +${tb}${sb?`, โบนัสตอบถูกต่อเนื่อง +${sb} 🔥`:""}`}
 else{G.bad++;G.st=0;msg=k<0?"⏰ หมดเวลา!":"❌ ยังไม่ถูกนะ"}
 document.querySelectorAll(".ch").forEach((b,i)=>{b.disabled=true;if(i==q.a)b.classList.add("ok");else if(i==k)b.classList.add("no")});
 $("#sc").textContent=G.score;
 $("#fb").innerHTML=`<div class="fb ${right?"ok":"no"}"><b>${msg}</b><br>เฉลย: ${"กขคง"[q.a]}. ${esc(q.c[q.a])}<br>💡 ${esc(q.e)}</div><button class="btn" onclick="nextQ()">${G.i+1<G.q.length?"ข้อต่อไป ▶":"ดูผลสรุป 🏁"}</button>`;
 $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function nextQ(){G.i++;G.i<G.q.length?ask():finish()}
async function finish(){const tot=G.q.length,pct=Math.round(G.ok/tot*100),ts=Math.round(G.spent/100)/10;
 const rec={student_no:P.no,name:P.name,score:G.score,correct:G.ok,wrong:G.bad,total:tot,percent:pct,time_sec:ts,best_streak:G.bs};
 app.innerHTML=`<h1>🏁 สรุปผลภารกิจ</h1><div class="card"><div class="big">${G.score}</div><div style="text-align:center">คะแนนรวม</div></div>
 <div class="grid"><div><b>${G.ok}</b>ถูก</div><div><b>${G.bad}</b>ผิด</div><div><b>${pct}%</b>ความถูกต้อง</div><div><b>${fmt(ts)}</b>เวลาที่ใช้ตอบ</div></div>
 <div class="card" id="rk">กำลังบันทึกคะแนน…</div>
 <button class="btn" onclick="start()">🔁 เล่นอีกครั้ง (สุ่มโจทย์ใหม่)</button><button class="btn alt" onclick="board()">🏆 Leaderboard</button><button class="btn ghost" onclick="home()">🏠 หน้าแรก</button>`;
 if(!DB){const l=JSON.parse(localStorage.getItem("won_local")||"[]");l.push({...rec,created_at:new Date().toISOString()});localStorage.setItem("won_local",JSON.stringify(l));
  $("#rk").innerHTML="💾 บันทึกในเครื่องนี้แล้ว แต่ยังไม่ได้เชื่อมต่อฐานข้อมูลส่วนกลาง จึงยังไม่มีอันดับ";return}
 try{const r=await fetch(SUPABASE_URL+"/rest/v1/plays",{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(rec)});if(!r.ok)throw 0;
  const b=best(await getAll()),k=key(rec),i=b.findIndex(x=>key(x)==k);
  $("#rk").innerHTML=`✅ บันทึกแล้ว<br>🏅 อันดับของคุณ (คะแนนดีที่สุด): <b style="color:var(--yel);font-size:24px">#${i+1}</b> จาก ${b.length} คน`}
 catch(e){$("#rk").innerHTML="⚠️ บันทึกคะแนนไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือการตั้งค่าฐานข้อมูล"}}
const key=x=>x.student_no+"|"+x.name.trim().toLowerCase();
async function getAll(){const r=await fetch(SUPABASE_URL+"/rest/v1/plays?select=*&order=score.desc,time_sec.asc&limit=2000",{headers:H});if(!r.ok)throw 0;return r.json()}
function best(a){a=a.slice().sort((x,y)=>y.score-x.score||x.time_sec-y.time_sec);const s=new Set();return a.filter(x=>{const k=key(x);if(s.has(k))return false;s.add(k);return true})}
async function board(){clearInterval(tick);
 app.innerHTML=`<h1>🏆 Leaderboard</h1><div class="card light" id="lb">${DB?"กำลังโหลด…":"ยังไม่ได้เชื่อมต่อฐานข้อมูล จึงไม่มีข้อมูลอันดับส่วนกลางให้แสดง"}</div><button class="btn" onclick="home()">🏠 กลับหน้าแรก</button>`;
 if(!DB)return;
 try{const b=best(await getAll()).slice(0,10),k=P.name?key({student_no:P.no,name:P.name}):"";
  $("#lb").innerHTML=b.length?`<div class="tw"><table><tr><th>#</th><th>ผู้เล่น</th><th>คะแนน</th><th>เวลา</th></tr>${b.map((x,i)=>`<tr class="${key(x)==k?"me":""}"><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${esc(x.name)} (เลขที่ ${x.student_no})</td><td><b>${x.score}</b></td><td>${fmt(x.time_sec)}</td></tr>`).join("")}</table></div><div style="font-size:14px;margin-top:6px">จัดอันดับจากคะแนนดีที่สุดของแต่ละคน ถ้าเท่ากันดูเวลาน้อยกว่า</div>`:"ยังไม่มีใครเล่น เป็นคนแรกเลย!"}
 catch(e){$("#lb").textContent="โหลดข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือการตั้งค่า"}}
const SQL=`create table plays (
  id bigint generated always as identity primary key,
  created_at timestamptz default now(),
  student_no int not null, name text not null,
  score int not null, correct int not null, wrong int not null,
  total int not null, percent int not null,
  time_sec numeric not null, best_streak int default 0);
alter table plays enable row level security;
create policy "anon insert" on plays for insert to anon with check (true);
create policy "anon read" on plays for select to anon using (true);`;
function teacher(){app.innerHTML=`<h1>👩‍🏫 หน้าสำหรับครู</h1><div class="card"><label>รหัสครู</label><input id="pin" type="password" placeholder="กรอกรหัส"><div id="er" style="color:var(--yel)"></div><button class="btn" onclick="tLogin()">เข้าสู่ระบบ</button></div><button class="btn ghost" onclick="home()">🏠 กลับหน้าแรก</button>`}
let rows=[];
async function tLogin(){if($("#pin").value!==TEACHER_PIN){$("#er").textContent="รหัสไม่ถูกต้อง";return}
 app.innerHTML=`<h1>📋 ข้อมูลนักเรียน</h1><div class="card light" id="tc">${DB?"กำลังโหลด…":""}</div>
 <div class="card"><b>วิธีตั้งค่าฐานข้อมูล (Supabase)</b><ol style="font-size:16px;padding-left:20px"><li>สร้างโปรเจกต์ที่ supabase.com</li><li>ไปที่ SQL Editor แล้วรันคำสั่งด้านล่าง</li><li>ไปที่ Project Settings › API คัดลอก Project URL และ anon public key</li><li>เปิดไฟล์นี้ด้วยโปรแกรมแก้ไขข้อความ ใส่ค่าที่ SUPABASE_URL และ SUPABASE_KEY (และเปลี่ยน TEACHER_PIN) แล้วบันทึก</li><li>นำไฟล์ไปเผยแพร่ เช่น Netlify, Vercel, GitHub Pages แล้วส่งลิงก์ให้นักเรียน</li></ol><pre>${esc(SQL)}</pre></div>
 <button class="btn ghost" onclick="home()">🏠 กลับหน้าแรก</button>`;
 if(!DB){$("#tc").innerHTML="ยังไม่ได้เชื่อมต่อฐานข้อมูล จึงยังไม่มีข้อมูลนักเรียนทั้งห้องให้แสดง ทำตามขั้นตอนด้านล่างเพื่อเริ่มใช้งาน";return}
 try{rows=await getAll();rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));drawT("")}catch(e){$("#tc").textContent="โหลดข้อมูลไม่สำเร็จ ตรวจสอบการตั้งค่า"}}
function drawT(f){const r=rows.filter(x=>(x.name+" "+x.student_no).toLowerCase().includes(f.toLowerCase())),pl=new Set(rows.map(key)).size;
 $("#tc").innerHTML=`<div>ผู้เล่น ${pl} คน · เล่นทั้งหมด ${rows.length} ครั้ง</div><input id="sf" placeholder="ค้นหาชื่อหรือเลขที่" value="${esc(f)}" oninput="drawT(this.value);$('#sf').focus()"><button class="btn alt" style="font-size:16px;padding:9px" onclick="csv()">⬇️ ดาวน์โหลด CSV</button><div class="tw"><table><tr><th>วันที่</th><th>เลขที่</th><th>ชื่อ</th><th>คะแนน</th><th>ถูก/ทั้งหมด</th><th>%</th><th>เวลา</th></tr>${r.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"})}</td><td>${x.student_no}</td><td>${esc(x.name)}</td><td>${x.score}</td><td>${x.correct}/${x.total}</td><td>${x.percent}</td><td>${x.time_sec}</td></tr>`).join("")}</table></div>`;
 const e=$("#sf");e.setSelectionRange(f.length,f.length)}
function csv(){const h=["created_at","student_no","name","score","correct","wrong","total","percent","time_sec","best_streak"];
 const t="\ufeff"+[h.join(",")].concat(rows.map(r=>h.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"').join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="work-or-not-scores.csv";a.click()}
home();
</script></body></html>
